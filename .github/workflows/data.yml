name: data
on:
  push:
    branches:
      - master
      - develop
jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: download-data
        env:
          YA_LINK: ${{ secrets.YA_LINK_DATA }}
        run: |
          chmod +x scripts/install_data.sh 
          scripts/install_data.sh $YA_LINK

      - name: setup-python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: train
        run: |
          cd src
          pip install poetry
          poetry install --no-root
          poetry run python train.py

      - name: save-model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/trained-model
          
          


            
