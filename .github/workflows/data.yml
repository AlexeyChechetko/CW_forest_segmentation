name: data
on:
  push
jobs:
  train:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: cache-data
        uses: actions/cache@v4
        with:
          path: ./data
          key: data

      - name: download-data
        env:
          YA_LINK: ${{ secrets.YA_LINK_DATA }}
        run: |
          if [ ! -d "./data" ]; then
            chmod +x scripts/install_data.sh 
            scripts/install_data.sh $YA_LINK
          fi

      - name: create-train-result-directory
        run: |
          mkdir results
          cd results
          mkdir train

      - name: setup-python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: train
        run: |
          cd src
          pip install poetry
          poetry install --no-root
          poetry run python trainer.py

      - name: save-train-results
        uses: actions/upload-artifact@v4
        with:
          name: train-results
          path: |
            results/train

  test:
    needs: train
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: download-trained-model
        uses: actions/download-artifact@v4
        with:
          name: train-results
          path: results/train

      - name: create-test-result-directory
        run: |
          mkdir -p results
          cd results
          mkdir test

      - name: setup-python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: test
        run: |
          cd src
          pip install poetry
          poetry install --no-root
          poetry run python tester.py

      - name: save-test-results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            results/test

            
